<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">ViperPad</title>
  <desc id="desc">A stacked ViperPad wordmark on a full dark background.</desc>
  <rect width="128" height="128" fill="#101b2d"/>
  <g font-family="Consolas, Courier New, monospace" font-size="18" font-weight="700" opacity=".16">
    <text x="8" y="23" fill="#36d6c2">&lt;/&gt;</text>
    <text x="91" y="23" fill="#ffd166">{ }</text>
    <text x="8" y="119" fill="#ffd166">#_</text>
    <text x="96" y="119" fill="#36d6c2">//</text>
  </g>
  <text x="64" y="60" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="700" fill="#36d6c2">Viper</text>
  <text x="64" y="87" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="32" font-weight="700" fill="#ffd166">Pad</text>
</svg>
